name = "keygate-relay"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Vault IDs served by this relay (comma separated). Empty = serve nothing (403).
[vars]
ALLOWED_VAULTS = ""
# Web Push public key (node scripts/vapid.mjs). Empty = push off, /push-key -> 404.
VAPID_PUBLIC = ""

# PWA served from the same Worker.
[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "VAULT"
class_name = "VaultDO"

# SQLite-backed Durable Object: available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultDO"]
