name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: build, vet, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      # The default Windows temp dir is an 8.3 short path (C:\Users\RUNNER~1\...), which breaks
      # the tests that compare resolved allowlist and broker paths; use the runner's long temp dir.
      - name: long TMP/TEMP (windows)
        if: runner.os == 'Windows'
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: go build
        run: go build ./...
      - name: go vet
        run: |
          go vet ./...
          go vet -tags kgtest ./...
      # macOS is outside the test matrix; it is vetted by cross-compilation only.
      - name: go vet (darwin)
        if: runner.os == 'Linux'
        run: |
          GOOS=darwin go vet ./...
          GOOS=darwin go vet -tags kgtest ./...
      # kgtest is the test build documented in the README: it enables the fake approver and plain
      # device-key backend the tests rely on; production builds never set it.
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race -count=1 -tags kgtest ./...
      - name: go test
        if: runner.os == 'Windows'
        run: go test -count=1 -tags kgtest ./...

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      # Go runs one fuzz target per invocation; the seed corpora also run in the test job above.
      # A crasher is written to testdata/fuzz/<Target>/ and uploaded below so it can be committed
      # as a regression input.
      - name: go test -fuzz
        run: |
          set -euo pipefail
          while read -r pkg target; do
            echo "::group::$pkg $target"
            go test -tags kgtest -run '^$' -fuzz "^${target}\$" -fuzztime 20s "$pkg"
            echo "::endgroup::"
          done <<'TARGETS'
          ./internal/broker/wire FuzzRequestDecode
          ./internal/broker/wire FuzzFrameStream
          ./internal/broker/wire FuzzFrameDecode
          ./internal/broker FuzzReadLine
          ./internal/redact FuzzWriterMatchesBytes
          ./internal/redact FuzzNoLeak
          ./internal/policy FuzzParse
          ./internal/policy FuzzQuotedScalarRoundTrip
          ./internal/policy FuzzParseTTL
          TARGETS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/'
          if-no-files-found: ignore
