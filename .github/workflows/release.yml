name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'install.sh', 'install.ps1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Version
        id: version
        env:
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="dev-${GITHUB_SHA:0:7}"
          if [ "$IS_TAG" = true ]; then version="$TAG"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build raw binaries
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ldflags="-s -w -X main.version=$VERSION -X main.commit=$GITHUB_SHA"
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              dir="raw/$os/$arch"
              mkdir -p "$dir"
              if [ "$os" = windows ]; then
                GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$dir/kg.exe" ./cmd/kg
                GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags -H=windowsgui" -o "$dir/kgw.exe" ./cmd/kg
              else
                GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$dir/kg" ./cmd/kg
              fi
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: raw-binaries
          path: raw/
          if-no-files-found: error

  sign-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raw-binaries
          path: raw
      - name: Sign and notarize when Apple credentials are configured
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERT_P12_BASE64" ] || [ -z "$APPLE_CERT_PASSWORD" ] ||
             [ -z "$APPLE_NOTARY_KEY_P8_BASE64" ] || [ -z "$APPLE_NOTARY_KEY_ID" ] ||
             [ -z "$APPLE_NOTARY_ISSUER_ID" ]; then
            echo 'Apple signing credentials incomplete; skipping native signing.'
            exit 0
          fi
          signing_dir=$(mktemp -d "$RUNNER_TEMP/apple-signing.XXXXXX")
          keychain="$signing_dir/signing.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$signing_dir/cert.p12"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$signing_dir/key.p8"
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/cert.p12" -P "$APPLE_CERT_PASSWORD" -k "$keychain" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"/ {print $2; exit}')
          test -n "$identity"
          for arch in amd64 arm64; do
            binary="raw/darwin/$arch/kg"
            chmod +x "$binary"
            codesign --force --keychain "$keychain" --sign "$identity" --options runtime --timestamp "$binary"
            codesign --verify --strict "$binary"
            ditto -c -k "$binary" "$signing_dir/$arch.zip"
            xcrun notarytool submit "$signing_dir/$arch.zip" --wait \
              --key "$signing_dir/key.p8" --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" --output-format json > "$signing_dir/result.json"
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("Notarization: " + r["status"]); sys.exit(0 if r["status"] == "Accepted" else 1)' "$signing_dir/result.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries
          path: raw/darwin/
          if-no-files-found: error

  sign-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raw-binaries
          path: raw
      - name: Sign when Windows credentials are configured
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:WINDOWS_CERT_PFX_BASE64 -or !$env:WINDOWS_CERT_PASSWORD) {
            Write-Host 'Windows signing credentials incomplete; skipping native signing.'
            exit 0
          }
          $cert = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (!$signtool) { throw 'Windows SDK signtool.exe not found' }
            Get-ChildItem raw/windows -Recurse -Filter '*.exe' | ForEach-Object {
              & $signtool sign /f $cert /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
              & $signtool verify /pa $_.FullName
              if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed' }
            }
          } finally {
            Remove-Item $cert -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: raw/windows/
          if-no-files-found: error

  package:
    needs: [build, sign-macos, sign-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw-binaries
          path: raw
      - uses: actions/download-artifact@v4
        with:
          name: darwin-binaries
          path: raw/darwin
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: raw/windows
      - name: Package and checksum
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              dir="raw/$os/$arch"
              cp LICENSE README.md "$dir/"
              name="kg_${version}_${os}_${arch}"
              if [ "$os" = windows ]; then
                (cd "$dir" && zip -q "../../../dist/$name.zip" kg.exe kgw.exe LICENSE README.md)
              else
                chmod +x "$dir/kg"
                tar -czf "dist/$name.tar.gz" -C "$dir" kg LICENSE README.md
              fi
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/
          if-no-files-found: error

  # Unpack the packaged archive on its own OS and check `kg version` reports the package version.
  verify-packages:
    needs: [build, package]
    name: verify packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: linux_amd64.tar.gz
            binary: kg
          - os: windows-latest
            archive: windows_amd64.zip
            binary: kg.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Check kg version
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ARCHIVE: kg_${{ needs.build.outputs.version }}_${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          (cd dist && grep -F " $ARCHIVE" SHA256SUMS | sha256sum -c -)
          mkdir unpacked
          case "$ARCHIVE" in
            *.zip) unzip -q "dist/$ARCHIVE" -d unpacked ;;
            *) tar -xzf "dist/$ARCHIVE" -C unpacked ;;
          esac
          got=$("unpacked/$BINARY" version)
          echo "$got"
          want="kg $VERSION (commit ${GITHUB_SHA:0:12}, "
          case "$got" in
            "$want"*) ;;
            *) echo "::error::kg version printed '$got', want prefix '$want'"; exit 1 ;;
          esac

  # Install from the packages with install.sh / install.ps1, and check a tampered archive is refused.
  verify-install:
    needs: [build, package]
    name: verify install scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Make a tampered copy (one byte of each archive flipped, SHA256SUMS kept)
        run: |
          set -euo pipefail
          cp -r dist tampered
          for f in tampered/*.tar.gz tampered/*.zip; do
            python3 -c 'import sys; p = sys.argv[1]; b = bytearray(open(p, "rb").read()); b[len(b) // 2] ^= 1; open(p, "wb").write(b)' "$f"
          done
          ! (cd tampered && sha256sum -c --quiet SHA256SUMS 2>/dev/null)
      - name: install.sh installs and kg version matches
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sh install.sh --version "$VERSION" --base-url "$PWD/dist" --dir "$RUNNER_TEMP/kg-ok"
          got=$("$RUNNER_TEMP/kg-ok/kg" version)
          case "$got" in "kg $VERSION (commit ${GITHUB_SHA:0:12}, linux/amd64)") ;; *) echo "::error::got '$got'"; exit 1 ;; esac
      - name: install.sh refuses a tampered archive
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          sh install.sh --version "$VERSION" --base-url "$PWD/tampered" --dir "$RUNNER_TEMP/kg-bad" 2>err.txt
          code=$?
          cat err.txt
          if [ "$code" -eq 0 ]; then echo '::error::install.sh exited 0 on a tampered archive'; exit 1; fi
          grep -q 'checksum mismatch' err.txt
          if [ -e "$RUNNER_TEMP/kg-bad" ]; then echo '::error::install.sh created files'; ls -la "$RUNNER_TEMP/kg-bad"; exit 1; fi
      # A bare ubuntu:24.04 image plus curl (tar, sha256sum and the rest are in the base image).
      - name: install.sh in a bare ubuntu:24.04 container
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -e VERSION -v "$PWD:/src:ro" ubuntu:24.04 sh -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends curl >/dev/null
            if sh /src/install.sh --version "$VERSION" --base-url file:///src/tampered; then
              echo "tampered archive was installed"; exit 1
            fi
            test ! -e "$HOME/.local/bin/kg"
            sh /src/install.sh --version "$VERSION" --base-url file:///src/dist
            "$HOME/.local/bin/kg" version | grep -F "kg $VERSION (commit "
          '
      - name: install.ps1 (Windows PowerShell 5.1, default directory) installs and adds the user PATH
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\install.ps1 -Version $env:VERSION -BaseUrl "$PWD\dist"
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\KeyGate'
          foreach ($name in 'kg.exe', 'kgw.exe') { if (-not (Test-Path (Join-Path $dir $name))) { throw "$name missing" } }
          $got = & (Join-Path $dir 'kg.exe') version
          $want = "kg $env:VERSION (commit $($env:GITHUB_SHA.Substring(0, 12)), windows/amd64)"
          if ($got -ne $want) { throw "kg version printed '$got', want '$want'" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (@($userPath -split ';' | Where-Object { $_ -ieq $dir }).Count -ne 1) { throw "user PATH: $userPath" }
      - name: install.ps1 (pwsh) reinstalls over it without a second PATH entry
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./install.ps1 -Version $env:VERSION -BaseUrl "$PWD\dist"
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\KeyGate'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (@($userPath -split ';' | Where-Object { $_ -ieq $dir }).Count -ne 1) { throw "user PATH: $userPath" }
          if (Get-ChildItem $dir -Filter '*.old') { throw 'left .old files' }
      - name: install.ps1 refuses a tampered archive (5.1 and pwsh)
        if: runner.os == 'Windows'
        run: |
          set -uo pipefail
          for ps in powershell pwsh; do
            dir="$RUNNER_TEMP/kg-bad-$ps"
            "$ps" -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Version "$VERSION" -BaseUrl "$PWD/tampered" -InstallDir "$dir" 2>err.txt
            code=$?
            cat err.txt
            if [ "$code" -eq 0 ]; then echo "::error::$ps install.ps1 exited 0 on a tampered archive"; exit 1; fi
            grep -q 'checksum mismatch' err.txt
            if [ -e "$dir" ]; then echo "::error::$ps install.ps1 created files"; ls -la "$dir"; exit 1; fi
          done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [package, verify-packages, verify-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*'
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --draft --verify-tag --title "$TAG" --notes 'Release archives and SHA256SUMS have GitHub/Sigstore keyless build provenance.

          Verify each downloaded archive and the checksum manifest:
          ```sh
          gh attestation verify <file> --repo ds-mrtq/keygate
          sha256sum -c SHA256SUMS
          ```
          Run attestation verification for SHA256SUMS and each archive you use. Download all archives before checking the full manifest. Native Apple/Windows signing is optional; see docs/RELEASE.md for details.'
